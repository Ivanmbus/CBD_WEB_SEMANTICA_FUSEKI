services:
  fuseki:
    image: stain/jena-fuseki
    container_name: fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin123
      - FUSEKI_DATASET_1=miDataset
    volumes:
      - ./data:/data
      - fuseki_data:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  loader:
      image: alpine
      container_name: fuseki-loader
      depends_on:
        fuseki:
          condition: service_healthy
      volumes:
        - ./data:/data
        - ./scripts:/scripts
      command: sh /scripts/load-data.sh
      restart: "no"
  backend:
    build:
      context: ./backend
      dockerfile: ../images/dockerfile.back
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      fuseki:
        condition: service_healthy
    environment:
      - FUSEKI_URL=http://fuseki:3030/miDataset/query

  frontend:
    build:
      context: ./frontend
      dockerfile: ../images/dockerfile.front
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  fuseki_data: