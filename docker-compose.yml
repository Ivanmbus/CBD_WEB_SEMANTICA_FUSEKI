services:
  fuseki:
    image: stain/jena-fuseki
    container_name: fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin123
      - FUSEKI_DATASET_1=miDataset
    volumes:
      - ./data:/data
      - fuseki_data:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  loader:
      image: alpine
      container_name: fuseki-loader
      depends_on:
        fuseki:
          condition: service_healthy
      volumes:
        - ./data:/data
        - ./scripts:/scripts
      command: sh /scripts/load-data.sh
      restart: "no"

volumes:
  fuseki_data: