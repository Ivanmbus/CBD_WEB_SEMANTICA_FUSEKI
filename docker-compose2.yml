services:
  fuseki:
    image: stain/jena-fuseki
    container_name: fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin123
    volumes:
      - fuseki_data:/fuseki
      - ./data:/staging
    restart: unless-stopped

  init:
    image: curlimages/curl:latest
    depends_on:
      - fuseki
    volumes:
      - ./data:/staging:ro
      - ./scripts/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

volumes:
  fuseki_data: